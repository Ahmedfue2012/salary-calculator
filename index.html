<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الراتب – مصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f3;--card:#fff;--tx:#0e2a3b;--mut:#5c7280;--bd:#d5e0e6;--hero:#0e2a3b;--herotx:#fff;
--net:#1fb59f;--ins:#4a86c5;--tax:#e39a3b;--fund:#9a6bc4;--in:#f4f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#0b1820;--card:#13252f;--tx:#e8f0f4;--mut:#8fa6b3;--bd:#24404e;--hero:#0a3a3a;--in:#0e1e27}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.7;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:540px;margin:0 auto;padding:18px 16px 28px}
header{margin:6px 0 16px}
h1{font-size:26px;font-weight:800;margin:0;line-height:1.3}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mut);padding:11px 6px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--hero);color:var(--herotx)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
label:first-child{margin-top:0}
input{width:100%;padding:12px 14px;font:inherit;font-size:20px;font-weight:600;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);direction:ltr;text-align:right}
input:focus{outline:2px solid var(--net);outline-offset:1px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.chk input{width:22px;height:22px;padding:0;accent-color:var(--net)}
select{width:100%;padding:12px;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g2 input{font-size:16px}
.result{background:var(--hero);color:var(--herotx);border-radius:18px;padding:20px 18px 18px;margin-bottom:12px}
.result small{display:block;opacity:.75;font-size:14px}
.result .num{font-size:40px;font-weight:800;direction:ltr;text-align:right;line-height:1.2}
.result .num i{font-style:normal;font-size:16px;font-weight:600;opacity:.75;margin-inline-start:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:16px 0 10px;background:rgba(255,255,255,.15)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;opacity:.9}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
.rows{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 16px;margin-bottom:12px}
.r{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.r:last-child{border:0}
.r span{display:flex;align-items:center;gap:8px}
.r span b{width:10px;height:10px;border-radius:3px}
.r strong{direction:ltr;font-weight:600}
.r.sum strong,.r.sum span{font-weight:800}
.note{font-size:12px;color:var(--mut);margin:0 0 14px}
footer{text-align:center;border-top:1px solid var(--bd);padding-top:14px;font-size:14px;color:var(--mut)}
footer strong{color:var(--tx);display:block;font-size:16px}
</style>
</head>
<body>
<main>
<header>
<h1>حاسبة الراتب</h1>
<p>التأمينات والضريبة وصندوق الشهداء</p>
</header>

<div class="tabs">
<button id="t2" class="on">من الصافي للإجمالي</button>
<button id="t1">من الإجمالي للصافي</button>
</div>

<div class="panel">
<label for="cat">فئة المؤمن عليه</label>
<select id="cat"><option value="0">تحت سن الستين</option><option value="60">فوق سن الستين</option></select>
<p class="hint" id="rateHint">نسبة تأمينات الموظف لهذه الفئة ثابتة: 11%</p>
<label id="lbl" for="amt">الراتب الصافي المطلوب (جنيه)</label>
<input id="amt" type="number" inputmode="decimal" placeholder="مثال: 15000">
<label for="ins">الأجر التأميني (اختياري، ولو فاضي بيتحسب تلقائياً = الإجمالي ÷ 1.3 بعد استبعاد 30% بدلات)</label>
<input id="ins" type="number" inputmode="decimal" placeholder="مثال: 8000">
<details><summary>إعدادات النسب والحدود</summary>
<div class="g2">
<div><label for="mp">صندوق الشهداء %</label><input id="mp" type="number" value="0.05" step="0.01"></div>
<div><label for="mn">أدنى أجر تأميني</label><input id="mn" type="number" value="2700"></div>
<div><label for="mx">أقصى أجر تأميني</label><input id="mx" type="number" value="16700"></div>
<div><label for="ex">الإعفاء الشخصي سنوياً</label><input id="ex" type="number" value="20000"></div>
</div>
</details>
</div>

<div id="out"></div>

<p class="note">الأرقام تقديرية. حدود التأمينات (2700 إلى 16700) سارية من يناير 2026، والشرائح الضريبية حسب قانون 91 لسنة 2005 وتعديلاته.</p>

<footer>
تصميم وإعداد
<strong>أ/ أحمد عبدالستار</strong>
</footer>
</main>

<script>
var mode=2;
var UP=[40000,55000,70000,200000,400000,1200000,Infinity],RT=[0,.10,.15,.20,.225,.25,.275];
function $(i){return document.getElementById(i)}
function v(i){var x=parseFloat($(i).value);return isNaN(x)?0:x}
function f(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function annualTax(t){
  if(t<=0)return 0;
  var s=t<=6e5?0:t<=7e5?1:t<=8e5?2:t<=9e5?3:t<=1.2e6?4:6;
  var tax=0,lo=0;
  for(var i=s;i<UP.length;i++){
    var hi=Math.min(UP[i],t);
    if(hi>lo)tax+=(hi-lo)*RT[i];
    lo=UP[i];
    if(t<=UP[i])break;
  }
  return tax;
}
function calc(g){
  var raw=v("ins")>0?v("ins"):g/1.3;
  var base=Math.min(Math.max(raw,v("mn")),v("mx"));
  if(g<=0)base=0;
  var ins=base*($("cat").value=="60"?1:11)/100;
  var mf=g*v("mp")/100;
  var tax=annualTax(Math.floor(g-ins)*12-v("ex"))/12;
  return{g:g,base:base,ins:ins,mf:mf,tax:tax,net:g-ins-mf-tax};
}
function solve(net){
  var lo=net,hi=net*3+20000;
  for(var i=0;i<80;i++){var m=(lo+hi)/2;if(calc(m).net<net)lo=m;else hi=m}
  return calc((lo+hi)/2);
}
function pct(x,g){return g>0?Math.max(0,x/g*100):0}
function render(){
  var a=v("amt");
  if(a<=0){$("out").innerHTML="";return}
  var r=mode==1?calc(a):solve(a);
  var tot=r.ins+r.mf+r.tax;
  var title=mode==1?"صافي الراتب الشهري":"الراتب الإجمالي المطلوب";
  var val=mode==1?r.net:r.g;
  $("out").innerHTML=
  '<div class="result"><small>'+title+'</small><div class="num">'+f(val)+'<i>جنيه</i></div>'+
  '<div class="bar">'+
  '<span style="width:'+pct(r.net,r.g)+'%;background:var(--net)"></span>'+
  '<span style="width:'+pct(r.ins,r.g)+'%;background:var(--ins)"></span>'+
  '<span style="width:'+pct(r.tax,r.g)+'%;background:var(--tax)"></span>'+
  '<span style="width:'+pct(r.mf,r.g)+'%;background:var(--fund)"></span></div>'+
  '<div class="legend">'+
  '<em><b style="background:var(--net)"></b>الصافي '+pct(r.net,r.g).toFixed(1)+'%</em>'+
  '<em><b style="background:var(--ins)"></b>تأمينات '+pct(r.ins,r.g).toFixed(1)+'%</em>'+
  '<em><b style="background:var(--tax)"></b>ضريبة '+pct(r.tax,r.g).toFixed(1)+'%</em>'+
  '<em><b style="background:var(--fund)"></b>شهداء '+pct(r.mf,r.g).toFixed(2)+'%</em></div></div>'+
  '<div class="rows">'+
  '<div class="r"><span>الراتب الإجمالي</span><strong>'+f(r.g)+'</strong></div>'+
  '<div class="r"><span><b style="background:var(--ins)"></b>التأمينات الاجتماعية</span><strong>− '+f(r.ins)+'</strong></div>'+
  '<div class="r"><span><b style="background:var(--tax)"></b>ضريبة كسب العمل</span><strong>− '+f(r.tax)+'</strong></div>'+
  '<div class="r"><span><b style="background:var(--fund)"></b>صندوق الشهداء</span><strong>− '+f(r.mf)+'</strong></div>'+
  '<div class="r"><span>إجمالي الخصومات</span><strong>− '+f(tot)+'</strong></div>'+
  '<div class="r sum"><span><b style="background:var(--net)"></b>الصافي الشهري</span><strong>'+f(r.net)+'</strong></div>'+
  '<div class="r"><span>الأجر التأميني (المحسوب عليه)</span><strong>'+f(r.base)+'</strong></div></div>';
}
function setMode(m){
  mode=m;
  $("t1").className=m==1?"on":"";$("t2").className=m==2?"on":"";
  $("lbl").textContent=m==1?"الراتب الإجمالي الشهري (جنيه)":"الراتب الصافي المطلوب (جنيه)";
  render();
}
$("t1").onclick=function(){setMode(1)};
$("t2").onclick=function(){setMode(2)};
["amt","ins","mp","mn","mx","ex"].forEach(function(i){$(i).oninput=render});
$("cat").onchange=function(){$("rateHint").textContent="نسبة تأمينات الموظف لهذه الفئة ثابتة: "+(this.value=="60"?"1%":"11%");render()};
</script>
</body>
</html>
